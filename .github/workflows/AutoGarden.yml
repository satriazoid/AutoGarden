name: AutoGarden

on:
  schedule:
    - cron: '0 2,4,6,8,10,12,14 * * *'
  workflow_dispatch:

jobs:
  cultivate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Gardening System
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "satriazoid"
          git config user.email "satriazoid@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}

          export TZ="Asia/Jakarta"
          HOUR=$(date +%H)
          DAY=$(date +%u)       # 1=Senin ... 7=Minggu
          TODAY=$(date '+%Y-%m-%d')

          # =========================
          # 1. CEK JAM AKTIF (09:00 - 21:00 WIB)
          # =========================
          if [ "$HOUR" -lt 9 ] || [ "$HOUR" -gt 21 ]; then
            echo "[INFO] Outside active hours (09-21 WIB). Sleeping..."
            exit 0
          fi

          # =========================
          # 2. TENTUKAN TARGET BERDASARKAN HARI
          #    Senin-Jumat: Random 3-8
          #    Sabtu-Minggu: Random 1-5
          # =========================
          TARGET_FILE=".garden_daily_target"

          LAST_TARGET_DATE=$(git show HEAD:$TARGET_FILE 2>/dev/null | head -1 || echo "")

          if [ "$LAST_TARGET_DATE" = "$TODAY" ]; then
            DAILY_TARGET=$(git show HEAD:$TARGET_FILE 2>/dev/null | tail -1)
          else
            if [ "$DAY" -le 5 ]; then
              # Senin - Jumat: 3 sampai 8
              DAILY_TARGET=$(( (RANDOM % 6) + 3 ))
              DAY_TYPE="Weekday"
            else
              # Sabtu - Minggu: 1 sampai 5
              DAILY_TARGET=$(( (RANDOM % 5) + 1 ))
              DAY_TYPE="Weekend"
            fi
            echo "[INFO] New daily target ($DAY_TYPE): $DAILY_TARGET commits"
          fi

          echo "[INFO] Date: $TODAY (Day $DAY) | Target: $DAILY_TARGET"

          # =========================
          # 3. HITUNG COMMIT HARI INI
          # =========================
          COUNT=$(git log --since="$TODAY 00:00:00" --until="$TODAY 23:59:59" --pretty=oneline | wc -l)
          echo "[INFO] Current commits: $COUNT / $DAILY_TARGET"

          if [ "$COUNT" -ge "$DAILY_TARGET" ]; then
            echo "[INFO] Daily target reached. Resting."
            exit 0
          fi

          REMAIN=$(( DAILY_TARGET - COUNT ))

          # =========================
          # 4. JUMLAH COMMIT SESI INI (Random 1-3)
          # =========================
          SESSION_MAX=$(( (RANDOM % 3) + 1 ))

          if [ "$SESSION_MAX" -gt "$REMAIN" ]; then
            SESSION_COUNT=$REMAIN
          else
            SESSION_COUNT=$SESSION_MAX
          fi

          echo "[INFO] Session: $SESSION_COUNT commit(s) | Remaining: $REMAIN"

          # =========================
          # 5. LOOP COMMIT DENGAN DELAY ACAK
          # =========================
          for ((i=1; i<=SESSION_COUNT; i++))
          do
            DELAY=$(( (RANDOM % 91) + 30 ))
            echo "[INFO] Waiting ${DELAY}s before next commit..."
            sleep $DELAY

            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            echo "Growth log: $TIMESTAMP - Step $i/$SESSION_COUNT - Seed:$RANDOM" > garden_log.txt

            # Simpan target harian agar konsisten sepanjang hari
            printf "%s\n%s" "$TODAY" "$DAILY_TARGET" > .garden_daily_target

            git add garden_log.txt .garden_daily_target

            MESSAGES=(
              "feat: update garden logic"
              "fix: pruning dead leaves"
              "docs: water plants"
              "chore: soil maintenance"
              "refactor: sun exposure optimization"
              "style: adjust plant spacing"
              "perf: improve growth speed"
              "test: check soil moisture"
              "build: add fertilizer mix"
            )

            MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

            if ! git diff --cached --quiet; then
              git commit -m "$MSG"
              echo "[OK] Committed: $MSG"
            fi
          done

          # =========================
          # 6. PUSH AMAN
          # =========================
          git pull --rebase origin main
          git push origin main
          echo "[OK] Pushed successfully."
